# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Build Once, Deploy Many:
#   build (tests + coverage) + sonarcloud -> deploy-uat -> deploy-prod
#
# Required secrets:
#   UAT_AZURE_WEBAPP_PUBLISH_PROFILE
#   PROD_AZURE_WEBAPP_PUBLISH_PROFILE
#   SONAR_TOKEN
#
# Required GitHub Environments:
#   UAT
#   Production  (add required reviewers for the approval gate)
#
# Also set this App Setting in each Azure Web App (UAT + Prod):
#   ConnectionStrings__PolicyPilot = <your SQL connection string>

name: Build, Scan & Deploy Many - PolicyPilot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build once — compile, test, coverage, publish artifact
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests with code coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: '**/TestResults/**/*.xml'

      - name: Publish Web API
        run: dotnet publish src/PolicyPilot.Api/PolicyPilot.Api.csproj -c Release -o ./publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  # ---------------------------------------------------------------------------
  # 2. SonarCloud code analysis (runs in parallel with build)
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial for accurate git blame and code metrics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ananthu1211
            -Dsonar.projectKey=ananthu1211_policypilot

  # ---------------------------------------------------------------------------
  # 3. Deploy to UAT (after build + sonarcloud pass; skip on pull requests)
  # ---------------------------------------------------------------------------
  deploy-uat:
    name: Deploy to UAT
    needs: [build, sonarcloud]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: UAT

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp

      - name: Deploy to Azure App Service (UAT)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'policypilot'
          publish-profile: ${{ secrets.UAT_AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./myapp

  # ---------------------------------------------------------------------------
  # 4. Deploy to Production (waits for GitHub Environment approval)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: deploy-uat
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp

      - name: Deploy to Azure App Service (Production)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'policypilotprod'
          publish-profile: ${{ secrets.PROD_AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./myapp
